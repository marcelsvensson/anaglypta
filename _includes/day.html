    <body>
        <header>Playlist: <a class="ext" href="https://open.spotify.com/playlist/YOUR_PLAYLIST_ID">Your playlist name</a></header>
        <main>
            <article class="open-sans-normal">
                <iframe data-testid="embed-iframe" style="border-radius:12px" src="" width="100%" height="80" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                <div class="meta">
                    <h2><strong></strong> - <a href="https://open.spotify.com/album/{{ albumId }}">{{ album }}</a></h2>
                    <span class="release"></span>
                    <span class="genre"></span>
                </div>
                <div class="filter">
                    <label class="filter-style filter-style-toggler" for="toggle-filter">
                        Show filter</label>
                    <fieldset>
                        <legend>
                            <label class="filter-style-toggle">
                                <input id="toggle-filter" type="checkbox" />Close</label>
                            <label class="filter-style">
                                <input id="no-filter" type="radio" name="genre-filter" value="off" checked />!filter</label>
                            <label class="filter-style">
                                <input id="show-filter" type="radio" name="genre-filter" value="show" />Show</label>
                            <label class="filter-style">
                                <input id="hide-filter" type="radio" name="genre-filter" value="hide" />Hide</label>
                        </legend>
                        <div id="filter-genres">
                        {% for tag in collections.genresOnly %} 
                            {% genreItem tag %}
                        {% endfor %}
                        </div>
                    </fieldset>
                </div>
                <div class="padder"></div>
            </article>
            <div class="album--list">
                {% for album in collections.album reversed %}
                    <a href="{{ album.url }}" data-genres="{% joinTags album.data.genreTags %}" data-artist="{{album.data.artist}}" data-track="{{album.data.id}}" data-album="{{album.data.album}}" data-album-id="{{album.data.albumId}}" data-release="{{album.data.release}}" class="album--list__item {% joinTags album.data.genreTags %}" style="background-image: url('{{ album.data.images }}')">
                    </a>
                {% endfor %}
            </div>
        </main>
        <canvas width="54" height="54" id="bitmap-canvas"></canvas>
    </body>
